<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="config.css">
</head>
<body>
    <div class="topbar">
  <div class="top-logo">
    <div class="logo-g">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="white" stroke-width="1.5"/><path d="M3 12h18M12 3c-2 3-3 5.5-3 9s1 6 3 9M12 3c2 3 3 5.5 3 9s-1 6-3 9" stroke="white" stroke-width="1.5"/></svg>
    </div>
    MUNDO DAS LÍNGUAS
  </div>
  <div class="top-step" id="topStepLabel">Passo 1 de 5 — Configuração inicial</div>
</div>

<div class="setup-wrap">

  <div class="progress-header">
    <div class="steps-bar">
      <div class="step-dot active" id="d1">1</div>
      <div class="step-line pending" id="l1"></div>
      <div class="step-dot pending" id="d2">2</div>
      <div class="step-line pending" id="l2"></div>
      <div class="step-dot pending" id="d3">3</div>
      <div class="step-line pending" id="l3"></div>
      <div class="step-dot pending" id="d4">4</div>
      <div class="step-line pending" id="l4"></div>
      <div class="step-dot pending" id="d5"><i class="ti ti-check" style="font-size:14px"></i></div>
    </div>
    <div class="steps-labels">
      <div class="step-lbl active" id="lbl1" style="text-align:left">Senha</div>
      <div class="step-lbl pending" id="lbl2">Plano</div>
      <div class="step-lbl pending" id="lbl3">Idiomas</div>
      <div class="step-lbl pending" id="lbl4">Horário</div>
      <div class="step-lbl pending" id="lbl5" style="text-align:right">Pronto!</div>
    </div>
  </div>

  <div class="card-setup" id="stepCard"></div>

</div>
<script src="config.js"></script>
</body>
</html>
